name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize, release
    runs-on: macos-latest
    env:
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history + all tags so scripts/release-notes.sh can diff
          # against the previous tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag and verify Cargo.toml version
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(awk -F '"' '/^version =/ { print $2; exit }' Cargo.toml)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG (version $VERSION) does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([1-9][0-9]{0,2})$ ]]; then
            if [ "${BASH_REMATCH[2]}" -gt 255 ]; then
              echo "::error::Beta number must not exceed 255"; exit 1
            fi
            SHORT_VERSION="${BASH_REMATCH[1]}"
            BUILD_VERSION="${SHORT_VERSION}b${BASH_REMATCH[2]}"
            PRERELEASE=true
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            SHORT_VERSION="$VERSION"
            BUILD_VERSION="$VERSION"
            PRERELEASE=false
          else
            echo "::error::Expected a stable version or X.Y.Z-beta.N"; exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "short_version=$SHORT_VERSION"
            echo "build_version=$BUILD_VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # See ci.yml for context: macos-latest runners ship a rustup-init stub
      # at /usr/local/bin/cargo that wins over the rustup-managed binary.
      - name: Prepend ~/.cargo/bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Import Developer ID signing cert
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Prepend to the search list so codesign finds it without a prompt.
          existing_keychains=()
          while read -r keychain; do
            existing_keychains+=("${keychain//\"/}")
          done < <(security list-keychain -d user)
          security list-keychain -d user -s \
            "$KEYCHAIN_PATH" "${existing_keychains[@]}"
          # Allow codesign/productsign to use the key non-interactively.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          rm -f "$CERT_PATH"

      - name: Build Grinch.app (universal)
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.short_version }}
          EXPECTED_BUILD: ${{ steps.meta.outputs.build_version }}
        run: |
          set -euo pipefail
          make build UNIVERSAL=1
          BUNDLE_VERSION=$(plutil -extract CFBundleShortVersionString raw \
            Grinch.app/Contents/Info.plist)
          if [ "$BUNDLE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Built app version $BUNDLE_VERSION does not match $EXPECTED_VERSION"
            exit 1
          fi
          BUNDLE_BUILD=$(plutil -extract CFBundleVersion raw Grinch.app/Contents/Info.plist)
          if [ "$BUNDLE_BUILD" != "$EXPECTED_BUILD" ]; then
            echo "::error::Built app version $BUNDLE_BUILD does not match $EXPECTED_BUILD"
            exit 1
          fi
          # Sanity-check the binary really is fat.
          lipo -info Grinch.app/Contents/MacOS/Grinch
          codesign --verify --deep --strict --all-architectures \
            --test-requirement='=anchor apple generic and
              entitlement["com.apple.application-identifier"] exists' \
            Grinch.app

      - name: Notarize and staple Grinch.app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          NOTARIZE_ZIP="$RUNNER_TEMP/notarize-app.zip"
          # notarytool wants a flat archive of the bundle, not the bundle itself.
          ditto -c -k --keepParent Grinch.app "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$MACOS_API_ISSUER_ID" \
            --wait

          # Embed the ticket in the bundle so Gatekeeper validates offline.
          xcrun stapler staple Grinch.app
          xcrun stapler validate Grinch.app
          spctl --assess --type execute --verbose Grinch.app

      - name: Build DMG
        run: |
          set -euo pipefail
          make dmg
          # Verify the DMG packaged the right binary: universal AND with
          # the stapled notarization ticket intact. Mount, inspect, eject.
          # Without this check, a future Makefile change could silently
          # ship single-arch / unstapled artifacts (regression of #2).
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" Grinch.dmg
          APP_BIN="$MOUNT_DIR/Grinch.app/Contents/MacOS/Grinch"
          lipo -info "$APP_BIN" | grep -E 'x86_64.*arm64|arm64.*x86_64' \
              || { echo "::error::DMG binary is not universal" >&2; exit 1; }
          xcrun stapler validate "$MOUNT_DIR/Grinch.app" \
              || { echo "::error::DMG .app is not stapled" >&2; exit 1; }
          hdiutil detach "$MOUNT_DIR" -quiet

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Notarize the DMG itself so Gatekeeper accepts it on download
          # without scary warnings (Apple's recommended flow notarizes both
          # layers — the .app's ticket is already stapled inside).
          xcrun notarytool submit Grinch.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$MACOS_API_ISSUER_ID" \
            --wait

          xcrun stapler staple Grinch.dmg
          xcrun stapler validate Grinch.dmg
          spctl --assess --type install --verbose Grinch.dmg

      - name: Package release artifacts
        id: package
        run: |
          set -euo pipefail
          ARTIFACT="Grinch-${{ steps.meta.outputs.tag }}.dmg"
          mv Grinch.dmg "$ARTIFACT"
          shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from git log
        id: notes
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          ./scripts/release-notes.sh auto "${{ steps.meta.outputs.tag }}" \
              > "$NOTES_FILE"
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          # Echo to the run log so it's visible without downloading the file.
          echo "--- generated notes ---"
          cat "$NOTES_FILE"
          echo "--- end ---"

      # Sparkle feed. Grinch's SUFeedURL is the appcast.xml asset of the
      # latest release, so each release carries a feed with its own DMG.
      # generate_appcast comes from the Sparkle archive `make build`
      # fetched and checksum-verified (see SPARKLE_* in the Makefile).
      - name: Generate Sparkle appcast
        if: steps.meta.outputs.prerelease == 'false'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set"
            exit 1
          fi
          SPARKLE_VERSION=$(awk '/^SPARKLE_VERSION/ { print $3; exit }' Makefile)
          GENERATE_APPCAST="build/sparkle-$SPARKLE_VERSION/bin/generate_appcast"
          UPDATES="$RUNNER_TEMP/updates"
          mkdir -p "$UPDATES"
          cp "$ARTIFACT" "$UPDATES/"
          # A Markdown file named after the DMG becomes the update's release notes.
          cp "$NOTES" "$UPDATES/${ARTIFACT%.dmg}.md"
          DOWNLOAD_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "$DOWNLOAD_PREFIX" \
            --embed-release-notes \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            "$UPDATES"
          APPCAST="$UPDATES/appcast.xml"
          xmllint --noout "$APPCAST"
          ENCLOSURE=$(xmllint --xpath 'string(//item/enclosure/@url)' "$APPCAST")
          ITEM_VERSION=$(xmllint --xpath 'string(//item/*[local-name()="version"])' "$APPCAST")
          SIGNATURE=$(xmllint --xpath 'string(//item/enclosure/@*[local-name()="edSignature"])' "$APPCAST")
          if [ "$ENCLOSURE" != "${DOWNLOAD_PREFIX}${ARTIFACT}" ] \
            || [ "$ITEM_VERSION" != "$VERSION" ] || [ -z "$SIGNATURE" ]; then
            echo "::error::appcast item doesn't match ${ARTIFACT} ${VERSION}" \
              "(url=${ENCLOSURE} version=${ITEM_VERSION} signed=${SIGNATURE:+yes})"
            exit 1
          fi
          cp "$APPCAST" appcast.xml
          echo "--- appcast ---"
          cat appcast.xml

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Grinch ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
            ${{ steps.meta.outputs.prerelease == 'false' && 'appcast.xml' || '' }}
